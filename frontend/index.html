      method:"DELETE"
    });
    await loadAdmin();
  } catch (error) {
    alert(error.message);
  }
}

let semanticButtonObserver = null;
let semanticButtonFrame = null;

function normalizeSemanticButtonText(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

function getSemanticButtonIntent(button){
  if(!button) return "";
  if(
    button.classList.contains("nav-primary-action") ||
    button.classList.contains("exercise-primary-button") ||
    button.classList.contains("image-lightbox-close") ||
    button.classList.contains("image-lightbox-nav")
  ){
    return "";
  }
  if(button.closest(".set-chip, .equipment-chip, .climbing-route-chip, .calendar-view-switch")){
    return "";
  }

  const text = normalizeSemanticButtonText(button.textContent);
  if(!text) return "";

  if(
    text.includes("supprimer") ||
    text.includes("effacer") ||
    text.startsWith("delete") ||
    text.includes("remove")
  ){
    return "delete";
  }

  if(
    text.includes("annuler") ||
    text.includes("fermer") ||
    text === "reset" ||
    text.startsWith("close")
  ){
    return "cancel";
  }

  if(
    text.includes("enregistrer") ||
    text.includes("sauvegarder") ||
    text.startsWith("save") ||
    text.includes("importer") ||
    text.startsWith("import ") ||
    text.includes("televerser") ||
    text.includes("upload")
  ){
    return "save";
  }

  if(
    text.includes("ajouter") ||
    text.startsWith("add") ||
    text.includes("+ activite") ||
    text.includes("+ activity") ||
    text.includes("acheter") ||
    text.includes("buy")
  ){
    return "add";
  }

  return "";
}

function applySemanticButtonStyles(root = document){
  const scope = root?.querySelectorAll ? root : document;
  scope.querySelectorAll("button").forEach((button) => {
    button.classList.remove("btn-add", "btn-save", "btn-cancel", "btn-delete");
    const intent = getSemanticButtonIntent(button);
    if(intent){
      button.classList.add(`btn-${intent}`);
    }
  });
}

function scheduleSemanticButtonStyles(){
  if(semanticButtonFrame){
    cancelAnimationFrame(semanticButtonFrame);
  }
  semanticButtonFrame = requestAnimationFrame(() => {
    semanticButtonFrame = null;
    applySemanticButtonStyles();
  });
}

function installSemanticButtonStyling(){
  scheduleSemanticButtonStyles();
  semanticButtonObserver?.disconnect();
  if(!document.body) return;
  semanticButtonObserver = new MutationObserver(() => {
    scheduleSemanticButtonStyles();
  });
  semanticButtonObserver.observe(document.body, {
    childList: true,
    subtree: true,
    characterData: true,
  });
}

function addSetToEditor(){
  syncPerformedEditorDraft();
  const trackingMode = normalizeTrackingMode(getExerciseTrackingMode(performedEditor?.exercise_name));
  const reps = normalizeOptionalInt(document.getElementById("setReps")?.value);
  const weight = normalizeOptionalFloat(document.getElementById("setWeight")?.value);
  const weightUnit = normalizeWeightUnit(document.getElementById("setWeightUnit")?.value || performedEditor?.weight_unit || getExerciseWeightUnit(performedEditor?.exercise_name));
  const durationSec = readDurationEditorSeconds();
  const watts = normalizeOptionalFloat(document.getElementById("setWatts")?.value);
  const set = normalizePerformedSetClient(
    trackingMode === "time_watts"
      ? { duration_sec: durationSec, watts }
      : { reps, weight, weight_unit: weightUnit }
  );
  if(!set){
    alert(trackingMode === "time_watts" ? "Ajoute au moins une durée ou des watts." : "Ajoute au moins des reps ou un poids.");
    return;
  }
  performedEditor.sets = performedEditor.sets || [];
  performedEditor.sets.push(set);
  performedEditor.weight_unit = weightUnit;
  clearPerformedSetInputDraft();
  const repsInput = document.getElementById("setReps");
  const weightInput = document.getElementById("setWeight");
  const hoursInput = document.getElementById("setDurationHours");
  const minutesInput = document.getElementById("setDurationMinutes");
  const secondsInput = document.getElementById("setDurationSeconds");
  const wattsInput = document.getElementById("setWatts");
  if(repsInput) repsInput.value = "";
  if(weightInput) weightInput.value = "";
  if(hoursInput) hoursInput.value = "";
  if(minutesInput) minutesInput.value = "";
  if(secondsInput) secondsInput.value = "";
  if(wattsInput) wattsInput.value = "";
  renderModal();
  requestAnimationFrame(resetPerformedSetInputsDom);
}
