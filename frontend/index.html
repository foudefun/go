
<!DOCTYPE html>
<html>
<head>

<style>
body { font-family: Arial, sans-serif; margin: 0; color: #1f2937; background:#f8fafc; }

}

}

}

}

 display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35);

 width:760px; max-width:95vw; max-height:88vh; overflow:auto;

}

.exercise-preview.placeholder { display:flex; align-items:center; justify-content:center; color:#64748b; font-size:13px; font-weight:600; background:linear-gradient(135deg, #f8fafc, #e2e8f0); object-fit:unset; }
.exercise-preview.detail { height:320px; object-fit:contain; background:#fff; padding:10px; }
.zoomable-image { cursor:zoom-in; }
.exercise-gallery { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-top:12px; }
.exercise-gallery .exercise-preview { height:140px; }

.editor-exercise-preview { margin-top:12px; display:grid; gap:8px; }
.editor-exercise-preview-main { width:100%; max-width:420px; height:280px; object-fit:contain; border-radius:14px; border:1px solid #dbe3ef; background:#fff; padding:10px; box-sizing:border-box; }
.editor-exercise-preview-main.placeholder { display:flex; align-items:center; justify-content:center; color:#64748b; font-size:13px; font-weight:600; background:linear-gradient(135deg, #f8fafc, #e2e8f0); }
.editor-exercise-gallery { display:flex; gap:8px; flex-wrap:wrap; }

.performance-hero-box { border:1px solid #bfdbfe; border-radius:12px; background:#fff; padding:10px; }
.performance-summary-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; }

.performance-session-list { display:grid; gap:6px; }
.collapsible-card summary { cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:12px; font-weight:700; }
.collapsible-card summary::-webkit-details-marker { display:none; }

.item-summary-meta { display:flex; gap:8px; flex-wrap:wrap; }
.exercise-card-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; }
.exercise-badges { display:flex; gap:8px; flex-wrap:wrap; }
.exercise-badge { display:inline-flex; align-items:center; border-radius:999px; padding:4px 10px; background:#eff6ff; color:#1d4ed8; font-size:12px; font-weight:600; }
.equipment-chip { display:inline-flex; align-items:center; gap:8px; border-radius:999px; padding:6px 10px; background:#ecfeff; color:#155e75; font-size:12px; font-weight:600; margin:4px 6px 0 0; }
.equipment-chip button { border:none; background:transparent; color:#155e75; cursor:pointer; padding:0; }
.equipment-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:16px; }
label { display:block; font-size:13px; }
.info-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-bottom:14px; }
.info-box { border:1px solid #e5e7eb; border-radius:6px; padding:10px; }
.exercise-media img { max-width: 220px; max-height: 120px; display:block; margin-top:8px; }
.linkline { margin-top:6px; }
.nav-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.auth-shell { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.auth-card { width:420px; max-width:100%; background:white; border:1px solid #e5e7eb; border-radius:12px; padding:24px; box-shadow:0 18px 45px rgba(15,23,42,0.08); }

.auth-card p { color:#64748b; }
.notice { background:#ecfeff; border:1px solid #a5f3fc; color:#155e75; padding:10px 12px; border-radius:8px; margin-bottom:12px; }
.warning { background:#fff7ed; border:1px solid #fdba74; color:#9a3412; padding:10px 12px; border-radius:8px; margin-bottom:12px; }
.error { background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; padding:10px 12px; border-radius:8px; margin-bottom:12px; }

.image-lightbox {
  display:none; position:fixed; inset:0; z-index:80; background:rgba(15,23,42,0.92);
  align-items:center; justify-content:center; padding:24px;
}
.image-lightbox.open { display:flex; }

  position:relative; width:min(1100px, 100%); max-height:100%;

}

@media (max-width: 768px) {

async function api(path, options = {}){
  const res = await fetch(`${API_BASE}${path}`, options);
  if(!res.ok){
    let detail = `API ${res.status}`;
    try {
      const contentType = res.headers.get("content-type") || "";
      if(contentType.includes("application/json")){
        const payload = await res.json();
        detail = payload?.detail || payload?.message || detail;
      } else {
        const text = (await res.text()).trim();
        if(text){
          detail = text;
        }
      }
    } catch (error) {
      // keep fallback detail
    }
    throw new Error(detail);
  }
  return res.json();
}

function show(page){
  document.getElementById("calendar").style.display = "none";
  document.getElementById("exercises").style.display = "none";
  document.getElementById("settings").style.display = "none";
  document.getElementById(page).style.display = "block";

  if(page === "calendar") loadCalendar();
  if(page === "exercises") loadExercises(true);
  if(page === "settings") loadSettings();
}

async function loadCalendar(){
  const today = getLocalTodayIso();
  const { startDate, endDate, monthLabel, gridDates } = getCalendarMonthContext(currentCalendarMonth);
  const rows = await api(`/calendar?start_date=${startDate}&end_date=${endDate}`);
  const rowsByDate = new Map(rows.map((row) => [row.date, row]));
  const showRehabCalendarInfo = authState?.username === "JST";

  const calendarOwnerLabel = authState?.username ? ` de ${escapeHtml(authState.username)}` : "";
  let html = `<h2>Calendrier${calendarOwnerLabel}</h2>`;
  html += `
    <div class="calendar-toolbar">
      <div>
        <label>Mois affiché</label>
        <input id="monthPicker" type="month" value="${currentCalendarMonth}" onchange="setCalendarMonth(this.value)">
      </div>
      <div class="actions">
        <button onclick="shiftCalendarMonth(-1)">Mois précédent</button>
        <button onclick="setCalendarMonth('${today.slice(0, 7)}')">Aujourd'hui</button>
        <button onclick="shiftCalendarMonth(1)">Mois suivant</button>
      </div>
      <div>
        <label>Ouvrir une date precise</label>
        <input id="jumpDate" type="date" value="${today}">
      </div>
      <div style="display:flex; align-items:end;">
        <button onclick="openSelectedDay()">Modifier ce jour</button>
      </div>
      <div class="calendar-view-switch">
        <div>
          <label>Vue</label>
          <div class="actions" style="margin-top:4px;">
            <button class="${currentCalendarView === "month" ? "active" : ""}" onclick="setCalendarView('month')">Mois</button>
            <button class="${currentCalendarView === "list" ? "active" : ""}" onclick="setCalendarView('list')">Liste</button>
          </div>
        </div>
      </div>
    </div>
  `;
  if(currentCalendarView === "month"){
    html += `<div class="calendar-panel"><div class="small" style="margin-bottom:12px;">${escapeHtml(monthLabel)}</div>`;
    html += `<div class="calendar-month-grid">${WEEKDAY_LABELS.map((label) => `<div class="calendar-weekday">${label}</div>`).join("")}`;
    gridDates.forEach((dateStr) => {
      const row = rowsByDate.get(dateStr);
      const isCurrentMonth = dateStr.startsWith(currentCalendarMonth);
      const classes = ["calendar-day"];
      if(!isCurrentMonth) classes.push("other-month");
      if(dateStr === today) classes.push("today");
      if(dateStr < today) classes.push("past-row");
      const planned = (row?.planned_exercises || []).map(formatExerciseName).join(", ");
      const performed = (row?.performed_exercises || []).map(formatExerciseName).join(", ");
      const activityBadge = renderActivityBadge(row?.activity_type || "", { compact: true });
      const targetLine = showRehabCalendarInfo ? `<div class="small calendar-day-target">J${row?.rehab_day || "-"} · cible ${row?.target_load ?? "-"}</div>` : "";

function getCalendarMonthContext(monthValue){
  const locale = getCurrentLanguage() === "en" ? "en-GB" : "fr-CH";
  const [year, month] = String(monthValue || getLocalTodayIso().slice(0, 7)).split("-").map(Number);
  const firstOfMonth = new Date(year, month - 1, 1);
  const lastOfMonth = new Date(year, month, 0);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(firstOfMonth.getDate() - startOffset);
  const endOffset = 6 - ((lastOfMonth.getDay() + 6) % 7);
  const gridEnd = new Date(lastOfMonth);
  gridEnd.setDate(lastOfMonth.getDate() + endOffset);
  const gridDates = [];
  for(let cursor = new Date(gridStart); cursor <= gridEnd; cursor.setDate(cursor.getDate() + 1)){
    gridDates.push(formatLocalDateIso(cursor));
  }
  return {
    startDate: gridDates[0],
    endDate: gridDates[gridDates.length - 1],
    monthLabel: firstOfMonth.toLocaleDateString(locale, { month: "long", year: "numeric" }),
    gridDates
  };
}

function shiftCalendarMonth(delta){

}

function getCalendarWeekContext(anchorDate){
  const focusDate = new Date(`${String(anchorDate || getLocalTodayIso())}T00:00:00`);
  const locale = getCurrentLanguage() === "en" ? "en-GB" : "fr-CH";
  const weekStart = new Date(focusDate);
  weekStart.setDate(focusDate.getDate() - ((focusDate.getDay() + 6) % 7));
  const weekDates = [];
  for(let offset = 0; offset < 7; offset += 1){
    const cursor = new Date(weekStart);
    cursor.setDate(weekStart.getDate() + offset);
    weekDates.push(formatLocalDateIso(cursor));
  }
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  return {
    startDate: weekDates[0],
    endDate: weekDates[weekDates.length - 1],
    weekDates,
    weekLabel: `${weekStart.toLocaleDateString(locale, { day: "numeric", month: "short" })} - ${weekEnd.toLocaleDateString(locale, { day: "numeric", month: "short", year: "numeric" })}`,
  };
}

function readDurationEditorSeconds(){
  const hours = normalizeOptionalInt(document.getElementById("setDurationHours")?.value);
  const minutes = normalizeOptionalInt(document.getElementById("setDurationMinutes")?.value);
  const seconds = normalizeOptionalInt(document.getElementById("setDurationSeconds")?.value);
  if(hours === null && minutes === null && seconds === null){
    return null;
  }
  return Math.max(0, (hours || 0) * 3600 + (minutes || 0) * 60 + (seconds || 0));
}

  const search = (document.getElementById("equipmentSearch")?.value || "").trim().toLowerCase();
  const selectedModelBrandId = Number(document.getElementById("equipmentModelBrandSelect")?.value || 0);
  const selectedEquipmentBrandId = Number(document.getElementById("equipmentBrandSelect")?.value || 0);

  equipmentBrands = await api("/equipment/brands");
  equipmentModels = await api("/equipment/models");
  equipmentCatalog = await api("/equipment");
  myEquipment = await api("/my-equipment");
 
  const editingBrand = equipmentBrands.find((item) => item.id === editingBrandId) || null;
  const editingEquipmentModel = equipmentModels.find((item) => item.id === editingEquipmentModelId) || null;
  const editingEquipment = equipmentCatalog.find((item) => item.id === editingEquipmentId) || null;
  const editingOwnedEquipment = myEquipment.find((item) => item.id === editingOwnedEquipmentId) || null;
  const modelFormBrandId = Number(editingEquipmentModel?.brand_id || selectedModelBrandId || equipmentBrands[0]?.id || 0);
  const equipmentFormBrandId = Number(editingEquipment?.brand_id || selectedEquipmentBrandId || equipmentBrands[0]?.id || 0);

    ? "Ajoute d'abord une marque"
    : !equipmentFormBrandId
      ? "Choisir d'abord une marque"
      : !modelOptionsForForm.length
        ? "Ajoute d'abord un modèle"

    .slice()

      const haystack = [item.name, item.brand_name, item.model_name, item.category, item.description].map((value) => String(value || "").toLowerCase());

function toJs(obj){
  return encodeURIComponent(JSON.stringify(obj));
}

function decodeJs(s){
  return JSON.parse(decodeURIComponent(s));
}

function formatExerciseName(name){
  return String(name || "").replace(/_/g, " ");
}

function titleizeLabel(label){
  return String(label || "")
    .split(" ")
    .filter(Boolean)
    .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
    .join(" ");
}

function getCurrentLanguage(){
  return authState?.language === "en" ? "en" : "fr";
}

function t(key){
  const lang = getCurrentLanguage();
  return UI_TEXT[lang]?.[key] || UI_TEXT.fr?.[key] || key;
}

function parseCategoryTokens(categoryValue){
  return [...new Set(
    String(categoryValue || "")
      .split(/[;,/|]+/)
      .map((token) => canonicalizeCategoryCode(token))
      .filter(Boolean)
  )];
}

function normalizeCategoryMatchValue(value){
  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[_\s-]+/g, "_");
}

function canonicalizeCategoryCode(category){
  const normalized = normalizeCategoryMatchValue(category);
  return CATEGORY_CODE_ALIASES[normalized] || normalized;
}

function parseCategoryInputValue(categoryValue){
  const aliasMap = {};
  Object.entries(CATEGORY_META).forEach(([code, labels]) => {
    aliasMap[normalizeCategoryMatchValue(code)] = code;
    aliasMap[normalizeCategoryMatchValue(labels.fr)] = code;
    aliasMap[normalizeCategoryMatchValue(labels.en)] = code;
  });
  return [...new Set(
    String(categoryValue || "")
      .split(/[;,/|]+/)
      .map((token) => normalizeCategoryMatchValue(token))
      .filter(Boolean)
      .map((token) => canonicalizeCategoryCode(aliasMap[token] || token))
  )].join(", ");
}

function formatCategoryInputValue(categoryValue){
  return parseCategoryTokens(categoryValue)
    .map((token) => getCategoryLabel(token))
    .join(", ");
}

function getCategoryInputPlaceholder(){
  const examples = getCurrentLanguage() === "en"
    ? ["Back", "Legs", "Arms", "Glutes"]
    : ["Dos", "Jambes", "Bras", "Fessiers"];
  return examples.join(", ") + "...";
}

function renderExerciseCategoryCheckboxes(categoryValue){
  const selectedTokens = new Set(parseCategoryTokens(categoryValue));
  return EXERCISE_EDITOR_CATEGORY_ORDER.map((category) => `
    <label class="category-checkbox-item">
      <input
        type="checkbox"
        name="exerciseCategoryOption"
        value="${escapeAttr(category)}"
        ${selectedTokens.has(category) ? "checked" : ""}
      >
      <span>${escapeHtml(getCategoryLabel(category))}</span>
    </label>
  `).join("");
}

function readExerciseEditorCategories(){
  return Array.from(document.querySelectorAll('input[name="exerciseCategoryOption"]:checked'))
    .map((input) => canonicalizeCategoryCode(input.value))
    .filter(Boolean)
    .join(", ");
}

function getExerciseDisplayName(exercise){
  const preferredLanguage = getCurrentLanguage();
  const preferredName = String(preferredLanguage === "en" ? (exercise?.display_name_en || "") : (exercise?.display_name_fr || "")).trim();
  const secondaryName = String(preferredLanguage === "en" ? (exercise?.display_name_fr || "") : (exercise?.display_name_en || "")).trim();
  const legacyName = String(exercise?.display_name || "").trim();
  if(preferredName){
    return titleizeLabel(preferredName);
  }
  if(legacyName){
    return titleizeLabel(legacyName);
  }
  if(secondaryName){
    return titleizeLabel(secondaryName);
  }
  return titleizeLabel(formatExerciseName(exercise?.name || ""));
}

function getExerciseSecondaryName(exercise){
  const preferredLanguage = getCurrentLanguage();
  const currentName = String(preferredLanguage === "en" ? (exercise?.display_name_en || "") : (exercise?.display_name_fr || "")).trim();
  const secondaryName = String(preferredLanguage === "en" ? (exercise?.display_name_fr || "") : (exercise?.display_name_en || "")).trim();
  if(!secondaryName || secondaryName.toLowerCase() === currentName.toLowerCase()){
    return "";
  }
  return titleizeLabel(secondaryName);
}

function getExerciseFamilyKey(exercise){
  const currentExercise = typeof exercise === "string"
    ? exerciseList.find((item) => item.name === exercise)
    : exercise;
  if(!currentExercise) return "";
  const family = String(currentExercise.movement_family || "").trim();
  return family || String(currentExercise.name || "").trim();
}

function getExerciseMovementFamilyOptions(currentName = ""){
  return sortExercisesForLibrary(exerciseList)
    .filter((exercise) => exercise.name !== currentName)
    .map((exercise) => `<option value="${escapeAttr(exercise.name)}">${escapeHtml(getExerciseDisplayName(exercise))} (${escapeHtml(exercise.name)})</option>`)
    .join("");
}

function getRelatedExercises(exercise){
  const currentExercise = typeof exercise === "string"
    ? exerciseList.find((item) => item.name === exercise)
    : exercise;
  if(!currentExercise) return [];
  const familyKey = getExerciseFamilyKey(currentExercise);
  if(!familyKey) return [];
  return sortExercisesForLibrary(exerciseList)
    .filter((candidate) => candidate.name !== currentExercise.name && getExerciseFamilyKey(candidate) === familyKey);
}

function getExerciseVariantDescription(exercise){
  return String(exercise?.variant_label || "").trim();
}

function getExercisePickerLabel(exercise){
  const baseLabel = getExerciseDisplayName(exercise);
  const variantDescription = getExerciseVariantDescription(exercise);
  return variantDescription ? `${baseLabel} - ${variantDescription}` : baseLabel;
}

function getExerciseSearchTerms(exercise){
  return [
    exercise?.name,
    exercise?.display_name,
    exercise?.display_name_fr,
    exercise?.display_name_en,
    exercise?.category,
    exercise?.movement_family,
    exercise?.variant_label,
    exercise?.description,
  ]
    .map((value) => String(value || "").toLowerCase())
    .filter(Boolean);
}

function getExerciseSearchHaystack(exercise){
  if(exercise?.name && exerciseSearchIndex.has(exercise.name)){
    return exerciseSearchIndex.get(exercise.name) || "";
  }
  return getExerciseSearchTerms(exercise).join(" | ");
}

function sortExercisesForLibrary(exercises){
  return exercises
    .slice()
    .sort((a, b) => {
      const imageScore = Number(Boolean(b.image)) - Number(Boolean(a.image));
      if(imageScore) return imageScore;
      return getExerciseDisplayName(a).localeCompare(getExerciseDisplayName(b), "fr", { sensitivity: "base" });
    });
}

function getMergeTargetOptionsHtml(currentName){
  return sortExercisesForLibrary(exerciseList)
    .filter((exercise) => exercise.name !== currentName)
    .map((exercise) => `<option value="${escapeAttr(exercise.name)}">${escapeHtml(getExercisePickerLabel(exercise))} (${escapeHtml(exercise.name)})</option>`)
    .join("");
}

function getFilteredExercises(search, selectedCategory){
  const searchableExercises = sortedExerciseLibraryList.length ? sortedExerciseLibraryList : sortExercisesForLibrary(exerciseList);
  return searchableExercises.filter((exercise) => {
    const haystack = getExerciseSearchHaystack(exercise);
    const matchesSearch = !search || haystack.includes(search);
    const matchesCategory = !selectedCategory || exerciseHasCategory(exercise, selectedCategory);
    return matchesSearch && matchesCategory;
  });
}

function exerciseMatchesSearch(exercise, search){
  const normalizedSearch = String(search || "").trim().toLowerCase();
  if(!normalizedSearch) return true;
  return getExerciseSearchHaystack(exercise).includes(normalizedSearch);
}

function getFilteredStrengthExercises(){
  const sortedExercises = sortedExerciseLibraryList.length
    ? sortedExerciseLibraryList
    : exerciseList
        .slice()
        .sort((a, b) => getExerciseDisplayName(a).localeCompare(getExerciseDisplayName(b), "fr", { sensitivity: "base" }));
  const normalizedExerciseSearch = String(performedExerciseSearch || "").trim().toLowerCase();
  let filteredStrengthExercises = sortedExercises.filter((exercise) => exerciseHasCategory(exercise, selectedStrengthCategory) && exerciseMatchesSearch(exercise, normalizedExerciseSearch));
  const selectedExerciseName = performedEditor?.exercise_name || "";
  if(selectedExerciseName && !filteredStrengthExercises.some((exercise) => exercise.name === selectedExerciseName)){
    const selectedExercise = sortedExercises.find((exercise) => exercise.name === selectedExerciseName);
    if(selectedExercise){
      filteredStrengthExercises = [selectedExercise].concat(filteredStrengthExercises);
    }
  }
  return filteredStrengthExercises;
}

function refreshPerformedExercisePicker(){
  const modalBox = document.querySelector(".modal-box");
  const preservedScrollTop = modalBox ? modalBox.scrollTop : 0;
  const searchInput = document.getElementById("performedExerciseSearch");
  const selectionStart = searchInput && typeof searchInput.selectionStart === "number" ? searchInput.selectionStart : null;
  const selectionEnd = searchInput && typeof searchInput.selectionEnd === "number" ? searchInput.selectionEnd : null;
  const exerciseSelect = document.getElementById("performedExerciseSelect");
  const countTarget = document.getElementById("performedExerciseSearchCount");
  if(!exerciseSelect || !countTarget) return;
  const filteredStrengthExercises = getFilteredStrengthExercises();
  const currentValue = performedEditor?.exercise_name || "";
  exerciseSelect.innerHTML = `<option value="">${escapeHtml(t("choose"))}</option>${
    filteredStrengthExercises.map((exercise) => `<option value="${exercise.name}"${currentValue === exercise.name ? " selected" : ""}>${escapeHtml(getExerciseDisplayName(exercise))}</option>`).join("")
  }`;
  exerciseSelect.value = currentValue;
  countTarget.textContent = `${filteredStrengthExercises.length} ${t("matching_exercises")}`;
  if(modalBox){
    modalBox.scrollTop = preservedScrollTop;
  }
  if(searchInput){
    searchInput.focus({ preventScroll:true });
    if(selectionStart !== null && selectionEnd !== null){
      try {
        searchInput.setSelectionRange(selectionStart, selectionEnd);
      } catch (error) {
        // ignore browsers that do not support restoring selection here
      }
    }
  }
}

function exerciseHasManagedReviewAsset(exercise){
  return normalizeImageList(exercise?.images, exercise?.image)
    .map(normalizeExternalUrl)
    .filter(Boolean)
    .some((url) => /\/assets\/exercises\/delavier\/|\/assets\/exercises\/weekly_program|\/api\/uploads\/exercises\//i.test(url));
}

function getExerciseReviewCandidates(exercises, scope = exerciseReviewScope){
  if(scope === "with_images"){
    return exercises.filter((exercise) => normalizeImageList(exercise?.images, exercise?.image).some(Boolean));
  }
  if(scope === "all"){
    return exercises;
  }
  return exercises.filter((exercise) => exerciseHasManagedReviewAsset(exercise));
}

function getCategoryLabel(category){
  const normalized = canonicalizeCategoryCode(category);
  if(CATEGORY_META[normalized]){
    return CATEGORY_META[normalized][getCurrentLanguage()];
  }
  return titleizeLabel(formatExerciseName(category || ""));
}

function getCategoryLabels(categoryValue){
  const tokens = parseCategoryTokens(categoryValue);
  return tokens.length ? tokens.map(getCategoryLabel) : [];
}

function exerciseHasCategory(exercise, category){
  const wanted = canonicalizeCategoryCode(category);
  if(!wanted) return true;
  return parseCategoryTokens(exercise?.category).includes(wanted);
}

function getActivityMeta(activityType){
  return ACTIVITY_META[String(activityType || "").trim()] || null;
}

function normalizeActivityTypeClient(activityType){
  const normalized = String(activityType || "").trim().toLowerCase();
  return ACTIVITY_META[normalized] ? normalized : "";
}

function getActivityLabel(activityType){
  const meta = getActivityMeta(activityType);
  return meta?.labels?.[getCurrentLanguage()] || meta?.labels?.fr || "";
}

function formatActivityTypeLabel(activityType){
  return getActivityLabel(activityType) || formatExerciseName(activityType || "") || "-";
}

function getActivityShortLabel(activityType){
  const meta = getActivityMeta(activityType);
  return meta?.short_labels?.[getCurrentLanguage()] || meta?.labels?.[getCurrentLanguage()] || meta?.short_labels?.fr || meta?.labels?.fr || "";
}

function renderActivityBadge(activityType, options = {}){
  const meta = getActivityMeta(activityType);
  if(!meta) return "";
  const compact = Boolean(options.compact);
  const label = compact ? getActivityShortLabel(activityType) : getActivityLabel(activityType);
  return `<span class="activity-badge${compact ? " compact" : ""}" style="background:${meta.color};">${escapeHtml(label)}</span>`;
}

function getCalendarRowActivityTypes(row){
  const types = Array.isArray(row?.activity_types) ? row.activity_types.filter(Boolean) : [];
  const primary = row?.activity_type ? String(row.activity_type).trim() : "";
  const ordered = [];
  const seen = new Set();
  if(primary){
    ordered.push(primary);
    seen.add(primary);
  }
  types.forEach((type) => {
    const value = String(type || "").trim();
    if(!value || seen.has(value)) return;
    ordered.push(value);
    seen.add(value);
  });
  return ordered;
}

function renderCalendarActivityBadges(row, options = {}){
  const compact = Boolean(options.compact);
  const badges = getCalendarRowActivityTypes(row)

function getLocalTodayIso(){

function formatLocalDateIso(dateValue){
  const value = dateValue instanceof Date ? dateValue : new Date(dateValue);
  const year = value.getFullYear();
  const month = String(value.getMonth() + 1).padStart(2, "0");
  const day = String(value.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function formatLocalMonthIso(dateValue){

function formatClimbingRoute(route){

function normalizeExternalUrl(url){
  const value = String(url || "").trim();
  if(!value) return "";
  if(/^(https?:)?\/\//i.test(value) || /^data:/i.test(value) || /^\//.test(value)){
    return value;
  }
  return `https://${value}`;
}

function normalizeImageList(images, fallbackImage = ""){
  const list = [];
  const seen = new Set();
  const primary = String(fallbackImage || "").trim();
  if(primary){
    list.push(primary);
    seen.add(primary);
  }
  const source = Array.isArray(images) ? images : [];
  source.forEach((raw) => {
    const value = String(raw || "").trim();
    if(!value || seen.has(value)) return;
    list.push(value);
    seen.add(value);
  });
  return list;
}

function updateLightboxView(){
  const overlay = document.getElementById("imageLightbox");
  const image = document.getElementById("lightboxImage");
  const caption = document.getElementById("lightboxCaption");
  if(!overlay || !image || !caption) return;
  const currentUrl = lightboxImages[lightboxIndex] || "";
  image.src = currentUrl;
  image.alt = lightboxCaption || "";
  const positionLabel = lightboxImages.length > 1 ? ` (${lightboxIndex + 1}/${lightboxImages.length})` : "";
  caption.textContent = `${lightboxCaption || ""}${positionLabel}`.trim();
  ["lightboxPrevDesktop", "lightboxPrevMobile"].forEach((id) => {
    const button = document.getElementById(id);
    if(button) button.disabled = lightboxImages.length <= 1;
  });
  ["lightboxNextDesktop", "lightboxNextMobile"].forEach((id) => {
    const button = document.getElementById(id);
    if(button) button.disabled = lightboxImages.length <= 1;
  });
}

function openImageLightbox(encodedUrls, index = 0, altLabel = ""){
  lightboxImages = decodeJs(encodedUrls);
  lightboxIndex = Math.max(0, Math.min(Number(index) || 0, lightboxImages.length - 1));
  lightboxCaption = String(altLabel || "");
  const overlay = document.getElementById("imageLightbox");
  if(!overlay || !lightboxImages.length) return;
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
  updateLightboxView();
}

function closeImageLightbox(event){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }
  const overlay = document.getElementById("imageLightbox");
  if(!overlay) return;
  overlay.classList.remove("open");
  document.body.style.overflow = "";
}

function handleLightboxBackdrop(event){
  if(event?.target?.id === "imageLightbox"){
    closeImageLightbox(event);
  }
}

function showPreviousLightboxImage(event){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }
  if(lightboxImages.length <= 1) return;
  lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
  updateLightboxView();
}

function showNextLightboxImage(event){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }
  if(lightboxImages.length <= 1) return;
  lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
  updateLightboxView();
}

function formatWeight(value){
  const number = Number(value || 0);
  if(Number.isNaN(number)) return "";
  return Number.isInteger(number) ? String(number) : String(number).replace(/\.0+$/, "").replace(/(\.\d*[1-9])0+$/, "$1");
}

function normalizeOptionalInt(value){
  if(value === null || value === undefined || value === "") return null;
  const parsed = Number.parseInt(String(value), 10);
  return Number.isFinite(parsed) ? parsed : null;
}

function normalizeOptionalFloat(value){
  if(value === null || value === undefined || value === "") return null;
  const parsed = Number.parseFloat(String(value).replace(",", "."));
  return Number.isFinite(parsed) ? parsed : null;
}

function parseDurationInputToSeconds(value){
  const raw = String(value ?? "").trim();
  if(!raw) return null;
  if(/^\d+$/.test(raw)){
    return normalizeOptionalInt(raw);
  }
  const parts = raw.split(":").map((part) => part.trim());
  if(parts.length > 3 || parts.some((part) => part === "" || !/^\d+$/.test(part))){
    return null;
  }
  const numbers = parts.map((part) => Number.parseInt(part, 10));
  if(numbers.some((part) => !Number.isFinite(part) || part < 0)){
    return null;
  }
  if(parts.length === 3){
    const [hours, minutes, seconds] = numbers;
    return (hours * 3600) + (minutes * 60) + seconds;
  }
  if(parts.length === 2){
    const [minutes, seconds] = numbers;
    return (minutes * 60) + seconds;
  }
  return numbers[0];
}

function normalizeTrackingMode(value){
  const mode = String(value || "").trim().toLowerCase();
  return mode === "time_watts" ? "time_watts" : "reps_weight";
}

function normalizeWeightUnit(value){
  const unit = String(value || "").trim().toLowerCase();
  return unit === "lb" ? "lb" : "kg";
}

function normalizeWorkMode(value){
  const mode = String(value || "").trim().toLowerCase();
  return ["superset", "biset"].includes(mode) ? mode : "normal";
}

function normalizeWorkType(value){
  const workType = String(value || "").trim().toLowerCase();
  return ["explosive", "force", "endurance"].includes(workType) ? workType : "resistance";
}

function convertWeightUnit(value, sourceUnit, targetUnit){
  const weight = normalizeOptionalFloat(value);
  if(weight === null) return null;
  const source = normalizeWeightUnit(sourceUnit);
  const target = normalizeWeightUnit(targetUnit);
  if(source === target) return Number(weight.toFixed(2));
  if(source === "lb" && target === "kg") return Number((weight * 0.45359237).toFixed(2));
  if(source === "kg" && target === "lb") return Number((weight / 0.45359237).toFixed(2));
  return Number(weight.toFixed(2));
}

function normalizePerformedSetClient(rawSet){
  const set = {};
  const reps = normalizeOptionalInt(rawSet?.reps);
  const weight = normalizeOptionalFloat(rawSet?.weight);
  const durationSec = parseDurationInputToSeconds(rawSet?.duration_sec);
  const watts = normalizeOptionalFloat(rawSet?.watts);
  if(reps !== null) set.reps = reps;
  if(weight !== null){
    set.weight = weight;
    set.weight_unit = normalizeWeightUnit(rawSet?.weight_unit);
  }
  if(durationSec !== null) set.duration_sec = durationSec;
  if(watts !== null) set.watts = watts;
  return Object.keys(set).length ? set : null;
}

function normalizePerformedItemClient(rawItem){
  const item = {
    exercise_name: String(rawItem?.exercise_name || "").trim(),
    custom_name: String(rawItem?.custom_name || "").trim(),
    work_mode: normalizeWorkMode(rawItem?.work_mode),
    work_type: normalizeWorkType(rawItem?.work_type),
    notes: String(rawItem?.notes || "").trim(),
    used_equipment: Array.isArray(rawItem?.used_equipment)
      ? rawItem.used_equipment.map(normalizeUsedEquipmentClient).filter(Boolean)
      : [],
    sets: Array.isArray(rawItem?.sets)
      ? rawItem.sets.map(normalizePerformedSetClient).filter(Boolean)
      : []
  };
  if(!item.exercise_name && !item.custom_name){
    return null;
  }
  if(!item.notes) delete item.notes;
  if(!item.custom_name) delete item.custom_name;
  if(item.work_mode === "normal") delete item.work_mode;
  if(item.work_type === "resistance") delete item.work_type;
  if(!item.used_equipment.length) delete item.used_equipment;
  if(!item.sets.length) delete item.sets;
  return item;
}

function normalizePlannedItemClient(rawItem){
  const item = {
    exercise_name: String(rawItem?.exercise_name || "").trim(),
    custom_name: String(rawItem?.custom_name || "").trim(),
    block: String(rawItem?.block || "").trim(),
    work_type: normalizeWorkType(rawItem?.work_type),
    notes: String(rawItem?.notes || "").trim(),
    used_equipment: Array.isArray(rawItem?.used_equipment)
      ? rawItem.used_equipment.map(normalizeUsedEquipmentClient).filter(Boolean)
      : [],
  };
  ["sets", "reps", "duration_min", "duration_sec"].forEach((key) => {
    const value = normalizeOptionalInt(rawItem?.[key]);
    if(value !== null) item[key] = value;
  });
  if(!item.exercise_name && !item.custom_name){
    return null;
  }
  if(!item.block) delete item.block;
  if(!item.notes) delete item.notes;
  if(!item.custom_name) delete item.custom_name;
  if(item.work_type === "resistance") delete item.work_type;
  if(!item.used_equipment.length) delete item.used_equipment;
  return item;
}

function blankDayActivity(){
  return {
    exercises: [],
    note: "",
    status: "todo",
    load: 0,
    physio_time: "",
    title: "",
    activity_type: "",
    activity_details: "",
    image: "",
    climbing_routes: [],
    performed_items: [],
    used_equipment: [],
  };
}

function activityHasContentClient(rawActivity){
  const activity = rawActivity && typeof rawActivity === "object" ? rawActivity : {};
  return Boolean(
    (activity.performed_items && activity.performed_items.length) ||
    String(activity.title || "").trim() ||
    String(activity.activity_type || "").trim() ||
    String(activity.activity_details || "").trim() ||
    String(activity.image || "").trim() ||
    (activity.climbing_routes && activity.climbing_routes.length) ||
    Number(activity.load || 0) > 0 ||
    String(activity.physio_time || "").trim() ||
    String(activity.note || "").trim()
  );
}

function normalizeDayActivityClient(rawActivity){
  const activity = {
    ...blankDayActivity(),
    ...(rawActivity && typeof rawActivity === "object" ? rawActivity : {}),
  };
  activity.exercises = Array.isArray(activity.exercises) ? activity.exercises.map((name) => String(name || "").trim()).filter(Boolean) : [];
  activity.performed_items = Array.isArray(activity.performed_items)
    ? activity.performed_items.map(normalizePerformedItemClient).filter(Boolean)
    : [];
  activity.used_equipment = Array.isArray(activity.used_equipment)
    ? activity.used_equipment.map(normalizeUsedEquipmentClient).filter(Boolean)
    : [];
  activity.climbing_routes = Array.isArray(activity.climbing_routes) ? activity.climbing_routes.filter(Boolean) : [];
  activity.note = String(activity.note || "");
  activity.load = Number(activity.load || 0) || 0;
  activity.physio_time = String(activity.physio_time || "").trim();
  activity.title = String(activity.title || "").trim();
  activity.activity_type = String(activity.activity_type || "").trim();
  activity.activity_details = String(activity.activity_details || "").trim();
  activity.image = String(activity.image || "").trim();
  if(!activity.activity_type && (activity.performed_items.length || activity.exercises.length)){
    activity.activity_type = "musculation";
  }
  if(activity.activity_type !== "musculation"){
    activity.performed_items = [];
    activity.exercises = [];
  }
  if(activity.activity_type !== "escalade"){
    activity.climbing_routes = [];
  }
  activity.status = activityHasContentClient(activity) ? "done" : "todo";
  return activity;
}

function ensureSessionActivities(){
  const existingActivities = Array.isArray(session.activities)
    ? session.activities.map(normalizeDayActivityClient)
    : [];
  if(existingActivities.length){
    session.activities = existingActivities;
  } else {
    const legacyActivity = normalizeDayActivityClient({
      exercises: session.exercises,
      note: session.note,
      status: session.status,
      load: session.load,
      physio_time: session.physio_time,
      title: session.activity_title,
      activity_type: session.activity_type,
      activity_details: session.activity_details,
      image: session.image,
      climbing_routes: session.climbing_routes,
      performed_items: session.performed_items,
      used_equipment: session.used_equipment,
    });
    session.activities = activityHasContentClient(legacyActivity) ? [legacyActivity] : [];
  }
  const requestedIndex = normalizeOptionalInt(session.draft_active_activity_index);
  if(!session.activities.length){
    activeActivityIndex = 0;
    session.draft_active_activity_index = 0;
    return;
  }
  const safeIndex = requestedIndex === null
    ? Math.max(0, Math.min(activeActivityIndex, session.activities.length - 1))
    : Math.max(0, Math.min(requestedIndex, session.activities.length - 1));
  activeActivityIndex = safeIndex;
  session.draft_active_activity_index = safeIndex;
}

function loadActivityIntoSessionView(index){
  ensureSessionActivities();
  const activity = session.activities[index] ? normalizeDayActivityClient(session.activities[index]) : blankDayActivity();
  activeActivityIndex = session.activities.length ? Math.max(0, Math.min(index, session.activities.length - 1)) : 0;
  session.exercises = Array.isArray(activity.exercises) ? [...activity.exercises] : [];
  session.note = activity.note || "";
  session.status = activity.status || "todo";
  session.load = Number(activity.load || 0) || 0;
  session.physio_time = activity.physio_time || "";
  session.activity_title = activity.title || "";
  session.activity_type = activity.activity_type || "";
  session.activity_details = activity.activity_details || "";
  session.image = activity.image || "";
  session.climbing_routes = Array.isArray(activity.climbing_routes) ? activity.climbing_routes.map((route) => ({ ...route })) : [];
  session.performed_items = Array.isArray(activity.performed_items) ? activity.performed_items.map((item) => ({ ...item, sets: Array.isArray(item.sets) ? item.sets.map((set) => ({ ...set })) : [], used_equipment: Array.isArray(item.used_equipment) ? item.used_equipment.map((equipment) => ({ ...equipment })) : [] })) : [];
  session.used_equipment = Array.isArray(activity.used_equipment) ? activity.used_equipment.map((equipment) => ({ ...equipment })) : [];
  session.draft_active_activity_index = activeActivityIndex;
}

function commitSessionViewToActiveActivity(){
  ensureSessionCollections();
  const normalizedActivity = normalizeDayActivityClient({
    exercises: session.exercises,
    note: session.note,
    status: session.status,
    load: session.load,
    physio_time: session.physio_time,
    title: session.activity_title,
    activity_type: session.activity_type,
    activity_details: session.activity_details,
    image: session.image,
    climbing_routes: session.climbing_routes,
    performed_items: session.performed_items,
    used_equipment: session.used_equipment,
  });
  if(!session.activities.length){
    if(activityHasContentClient(normalizedActivity)){
      session.activities = [normalizedActivity];
      activeActivityIndex = 0;
    }
    session.draft_active_activity_index = activeActivityIndex;
    return;
  }
  session.activities[activeActivityIndex] = normalizedActivity;
  session.draft_active_activity_index = activeActivityIndex;
}

function getActivityDisplaySummary(activity, index){

  const parts = [
    String(normalized.title || "").trim(),
    normalized.activity_type ? getActivityLabel(normalized.activity_type) : "",
    String(normalized.activity_details || "").trim(),
    normalized.performed_items.length ? `${normalized.performed_items.length} ex.` : "",
    normalized.climbing_routes.length ? `${normalized.climbing_routes.length} voie(s)` : "",
    normalized.image ? t("activity_photo").toLowerCase() : "",
  ].filter(Boolean);
  const baseLabel = t("activity_number").replace("{number}", String(index + 1));
  return parts.length ? `${baseLabel} · ${parts.join(" | ")}` : baseLabel;
}

function getActivityDisplayTitle(activity, index){
  const normalized = normalizeDayActivityClient(activity);
  const title = String(normalized.title || "").trim();
  if(title) return title;
  if(normalized.activity_type) return getActivityLabel(normalized.activity_type);
  const firstPerformed = normalized.performed_items?.[0];
  if(firstPerformed) return getPerformedItemLabel(firstPerformed);
  const details = String(normalized.activity_details || "").trim();
  if(details) return details;
  return t("activity_number").replace("{number}", String(index + 1));
}

function ensureSessionCollections(){
  session.exercises = Array.isArray(session.exercises) ? session.exercises : [];
  session.planned_items = Array.isArray(session.planned_items) ? session.planned_items : [];
  session.performed_items = Array.isArray(session.performed_items) ? session.performed_items : [];
  session.used_equipment = Array.isArray(session.used_equipment) ? session.used_equipment.map(normalizeUsedEquipmentClient).filter(Boolean) : [];
  session.climbing_routes = Array.isArray(session.climbing_routes) ? session.climbing_routes : [];
  session.activity_title = String(session.activity_title || "").trim();
  session.activity_type = String(session.activity_type || "").trim();
  session.activity_details = String(session.activity_details || "").trim();
  session.image = String(session.image || "").trim();
  session.plan_activity_type = String(session.plan_activity_type || "").trim();
  session.plan_time = String(session.plan_time || "").trim();
  ensureSessionActivities();
}

function getSessionDraftKey(dateValue = currentDate){
  if(!authUser || !dateValue) return "";
  return `${SESSION_DRAFT_PREFIX}:${authUser}:${dateValue}`;
}

function buildSessionDraftPayload(){
  ensureSessionCollections();
  syncSessionGeneralDraft();
  commitSessionViewToActiveActivity();
  return {
    session: {
      note: session.note || "",
      load: session.load || 0,
      physio_time: session.physio_time || "",
      title: session.activity_title || "",
      activity_type: session.activity_type || "",
      activity_details: session.activity_details || "",
      image: session.image || "",
      climbing_routes: session.climbing_routes || [],
      status: session.status || "todo",
      performed_items: session.performed_items || [],
      exercises: session.exercises || [],
      plan_activity_type: session.plan_activity_type || "",
      plan_time: session.plan_time || "",
      plan_title: session.plan_title || "",
      duration_target_min: session.duration_target_min ?? null,
      location: session.location || "",
      plan_notes: session.plan_notes || "",
      planned_items: session.planned_items || [],
      activities: session.activities || [],
      draft_active_activity_index: activeActivityIndex,
    },
    performedEditor: performedEditor || blankPerformedEditor(),
    plannedEditor: plannedEditor || blankPlannedEditor(),
    selectedStrengthCategory,
    performedExerciseSearch,
    plannedSectionExpanded,
    saved_at: new Date().toISOString(),
  };
}

function buildSessionRequestPayload(options = {}){
  const includeDraft = options.includeDraft !== false;
  ensureSessionCollections();
  syncSessionGeneralDraft();
  syncPerformedEditorDraft();
  syncPlannedEditorDraft();
  session.planned_items = (session.planned_items || []).map(normalizePlannedItemClient).filter(Boolean);
  session.performed_items = isStrengthActivity(session.activity_type)
    ? (session.performed_items || []).map(normalizePerformedItemClient).filter(Boolean)
    : [];
  if(!isStrengthActivity(session.activity_type)){
    session.exercises = [];
  }
  if(!isClimbingActivity(session.activity_type)){
    session.climbing_routes = [];
  }
  updateSessionExerciseNames();
  commitSessionViewToActiveActivity();
  session.status = computeSessionStatus();
  const persistedActivityIndex = includeDraft
    ? activeActivityIndex
    : Math.max(0, (session.activities || []).findIndex((activity) => activityHasContentClient(activity)));

  const payload = {
    performed_items: session.performed_items || [],
    exercises: session.exercises || [],
    note: session.note || "",
    status: session.status || "todo",
    load: session.load || 0,
    physio_time: session.physio_time || "",
    title: session.activity_title || "",
    activity_type: session.activity_type || "",
    activity_details: session.activity_details || "",
    image: session.image || "",
    climbing_routes: session.climbing_routes || [],
    plan_activity_type: session.plan_activity_type || "",
    plan_time: session.plan_time || "",
    plan_title: session.plan_title || "",
    duration_target_min: session.duration_target_min || null,
    location: session.location || "",
    plan_notes: session.plan_notes || "",
    planned_items: session.planned_items || [],
    activities: session.activities || [],
    draft_active_activity_index: persistedActivityIndex,
  };

  if(includeDraft){
    const draft = buildSessionDraftPayload();
    payload.draft_performed_editor = draft.performedEditor || {};
    payload.draft_planned_editor = draft.plannedEditor || {};
    payload.draft_selected_strength_category = draft.selectedStrengthCategory || "";
    payload.draft_planned_section_expanded = Boolean(draft.plannedSectionExpanded);
    payload.draft_updated_at = draft.saved_at || new Date().toISOString();
  } else {
    payload.draft_performed_editor = {};
    payload.draft_planned_editor = {};
    payload.draft_selected_strength_category = "";
    payload.draft_planned_section_expanded = false;
    payload.draft_updated_at = "";
  }

  return payload;
}

function mergeDraftSessionIntoCurrentSession(draftSession){
  const baseSession = { ...session };
  const draft = draftSession && typeof draftSession === "object" ? draftSession : {};
  const merged = { ...baseSession, ...draft };

  for(const key of ["performed_items", "planned_items", "used_equipment", "climbing_routes", "exercises", "activities"]){
    const currentArray = Array.isArray(baseSession[key]) ? baseSession[key] : [];
    const draftArray = Array.isArray(draft[key]) ? draft[key] : null;
    merged[key] = draftArray && draftArray.length ? draftArray : currentArray;
  }

  for(const key of ["activity_type", "activity_details", "note", "physio_time", "plan_activity_type", "plan_time", "plan_title", "location", "plan_notes"]){
    const currentValue = String(baseSession[key] || "").trim();
    const draftValue = String(draft[key] || "").trim();
    merged[key] = draftValue || currentValue;
  }

  if(draft.duration_target_min === null || draft.duration_target_min === undefined || draft.duration_target_min === ""){
    merged.duration_target_min = baseSession.duration_target_min ?? null;
  }

  if(draft.load === null || draft.load === undefined || draft.load === ""){
    merged.load = baseSession.load || 0;
  }
  if(!String(draft.image || "").trim()){
    merged.image = baseSession.image || "";
  }

  if(draft.status === null || draft.status === undefined || draft.status === ""){
    merged.status = baseSession.status || "todo";
  }
  if(draft.draft_active_activity_index === null || draft.draft_active_activity_index === undefined || draft.draft_active_activity_index === ""){
    merged.draft_active_activity_index = baseSession.draft_active_activity_index ?? 0;
  }

  session = merged;
}

function persistSessionDraft(){
  const key = getSessionDraftKey();
  if(!key || !session || !currentDate) return;
  try {
    syncSessionGeneralDraft();
    syncPerformedEditorDraft();
    syncPlannedEditorDraft();
    localStorage.setItem(key, JSON.stringify(buildSessionDraftPayload()));
  } catch (error) {
    console.warn("Could not persist session draft", error);
  }
}

function restoreEmbeddedSessionDraft(){
  const hasPerformedDraft = session?.draft_performed_editor && Object.keys(session.draft_performed_editor).length;
  const hasPlannedDraft = session?.draft_planned_editor && Object.keys(session.draft_planned_editor).length;
  if(!hasPerformedDraft && !hasPlannedDraft && !session?.draft_selected_strength_category){
    return false;
  }
  if(hasPerformedDraft){
    performedEditor = {
      ...blankPerformedEditor(),
      ...session.draft_performed_editor,
      sets: Array.isArray(session.draft_performed_editor.sets) ? session.draft_performed_editor.sets.map((set) => ({ ...set })) : [],
      used_equipment: Array.isArray(session.draft_performed_editor.used_equipment) ? session.draft_performed_editor.used_equipment.map((equipment) => ({ ...equipment })) : [],
    };
  }
  if(hasPlannedDraft){
    plannedEditor = {
      ...blankPlannedEditor(),
      ...session.draft_planned_editor,
      used_equipment: Array.isArray(session.draft_planned_editor.used_equipment) ? session.draft_planned_editor.used_equipment.map((equipment) => ({ ...equipment })) : [],
    };
  }
  selectedStrengthCategory = String(session.draft_selected_strength_category || "").trim().toLowerCase();
  performedExerciseSearch = "";
  plannedSectionExpanded = Boolean(session.draft_planned_section_expanded);
  activeActivityIndex = Math.max(0, normalizeOptionalInt(session.draft_active_activity_index) ?? 0);
  return true;
}

function restoreSessionDraft(dateValue = currentDate){
  const key = getSessionDraftKey(dateValue);
  if(!key) return false;
  const rawDraft = localStorage.getItem(key);
  if(!rawDraft) return false;
  try {
    const parsed = JSON.parse(rawDraft);
    mergeDraftSessionIntoCurrentSession(parsed.session || {});
    ensureSessionCollections();
    session.performed_items = (session.performed_items || []).map(normalizePerformedItemClient).filter(Boolean);
    session.planned_items = (session.planned_items || []).map(normalizePlannedItemClient).filter(Boolean);
    performedEditor = parsed.performedEditor
      ? { ...blankPerformedEditor(), ...parsed.performedEditor, sets: Array.isArray(parsed.performedEditor.sets) ? parsed.performedEditor.sets.map((set) => ({ ...set })) : [] }
      : blankPerformedEditor();
    plannedEditor = parsed.plannedEditor
      ? { ...blankPlannedEditor(), ...parsed.plannedEditor, used_equipment: Array.isArray(parsed.plannedEditor.used_equipment) ? parsed.plannedEditor.used_equipment.map((equipment) => ({ ...equipment })) : [] }
      : blankPlannedEditor();
    if(Array.isArray(parsed.performedEditor?.used_equipment)){
      performedEditor.used_equipment = parsed.performedEditor.used_equipment.map((equipment) => ({ ...equipment }));
    }
    selectedStrengthCategory = String(parsed.selectedStrengthCategory || "").trim().toLowerCase();
    performedExerciseSearch = String(parsed.performedExerciseSearch || "").trim();
    plannedSectionExpanded = Boolean(parsed.plannedSectionExpanded);
    activeActivityIndex = Math.max(0, normalizeOptionalInt(parsed.session?.draft_active_activity_index ?? parsed.draftActiveActivityIndex) ?? 0);
    updateSessionExerciseNames();
    return true;
  } catch (error) {
    console.warn("Could not restore session draft", error);
    localStorage.removeItem(key);
    return false;
  }
}

function clearSessionDraft(dateValue = currentDate){
  const key = getSessionDraftKey(dateValue);
  if(key){
    localStorage.removeItem(key);
  }
}

function syncSessionGeneralDraft(){
  const loadInput = document.getElementById("load");
  const physioInput = document.getElementById("physioTime");
  const activityTitleInput = document.getElementById("activityTitle");
  const activityTypeInput = document.getElementById("activityType");
  const activityDetailsInput = document.getElementById("activityDetails");
  const noteInput = document.getElementById("note");
  if(loadInput) session.load = parseFloat(loadInput.value) || 0;
  if(physioInput) session.physio_time = physioInput.value || "";
  if(activityTitleInput) session.activity_title = activityTitleInput.value.trim();
  if(activityTypeInput) session.activity_type = activityTypeInput.value || "";
  if(activityDetailsInput) session.activity_details = activityDetailsInput.value.trim();
  if(noteInput) session.note = noteInput.value;
  session.status = computeSessionStatus();
  session.draft_active_activity_index = activeActivityIndex;
}

function computeSessionStatus(){
  ensureSessionCollections();
  if(Array.isArray(session.activities) && session.activities.some((activity) => activityHasContentClient(activity))){
    return "done";
  }
  const hasActualContent = Boolean(
    (session.performed_items && session.performed_items.length) ||
    (session.activity_title && session.activity_title.trim()) ||
    (session.activity_type && session.activity_type.trim()) ||
    (session.activity_details && session.activity_details.trim()) ||
    (session.climbing_routes && session.climbing_routes.length) ||
    Number(session.load || 0) > 0 ||
    (session.physio_time && session.physio_time.trim()) ||
    (session.note && session.note.trim())
  );
  return hasActualContent ? "done" : "todo";
}

function captureSessionDraft(){
  if(document.getElementById("modal").style.display !== "flex") return;
  persistSessionDraft();
  scheduleSessionAutosave();
}

function setSessionAutosaveState(state){
  sessionAutosaveState = state;
  const target = document.getElementById("sessionAutosaveStatus");
  if(!target) return;
  if(state === "saving"){
    target.textContent = t("autosave_pending");
  } else if(state === "saved"){
    target.textContent = t("autosave_saved");
  } else if(state === "error"){
    target.textContent = t("autosave_error");
  } else {
    target.textContent = "";
  }
}

function scheduleSessionAutosave(){
  if(!currentDate || document.getElementById("modal").style.display !== "flex") return;
  if(sessionAutosaveTimer){
    clearTimeout(sessionAutosaveTimer);
  }
  sessionAutosaveQueued = true;
  setSessionAutosaveState("saving");
  sessionAutosaveTimer = setTimeout(() => {
    sessionAutosaveTimer = null;
    void performSessionAutosave();
  }, 900);
}

async function performSessionAutosave(){
  if(!currentDate || sessionAutosaveInFlight){
    return;
  }
  sessionAutosaveInFlight = true;
  sessionAutosaveQueued = false;
  try {
    await api(`/session/${currentDate}`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(buildSessionRequestPayload({ includeDraft: true }))
    });
    setSessionAutosaveState("saved");
  } catch (error) {
    console.warn("Autosave failed", error);
    setSessionAutosaveState("error");
  } finally {
    sessionAutosaveInFlight = false;
    if(sessionAutosaveQueued){
      scheduleSessionAutosave();
    }
  }
}

function formatDurationSeconds(value){
  const duration = normalizeOptionalInt(value);
  if(duration === null) return "";
  const hours = Math.floor(duration / 3600);
  const minutes = Math.floor((duration % 3600) / 60);
  const seconds = duration % 60;
  return [hours, minutes, seconds].map((part) => String(part).padStart(2, "0")).join(":");
}

function formatPerformedSet(set){
  const reps = normalizeOptionalInt(set?.reps);
  const weight = normalizeOptionalFloat(set?.weight);
  const weightUnit = normalizeWeightUnit(set?.weight_unit);
  const durationSec = normalizeOptionalInt(set?.duration_sec);
  const watts = normalizeOptionalFloat(set?.watts);
  if(durationSec !== null && watts !== null){
    return `${formatDurationSeconds(durationSec)} @ ${formatWeight(watts)} W`;
  }
  if(durationSec !== null){
    return formatDurationSeconds(durationSec);
  }
  if(watts !== null){
    return `${formatWeight(watts)} W`;
  }
  if(reps !== null && weight !== null){
    return `${reps} reps @ ${formatWeight(weight)} ${weightUnit}`;
  }
  if(reps !== null){
    return `${reps} reps`;
  }
  if(weight !== null){
    return `${formatWeight(weight)} ${weightUnit}`;
  }
  return "Serie";
}

function getRecommendationLabel(strategy){
  if(strategy === "increase") return t("suggest_increase");
  if(strategy === "reduce") return t("suggest_reduce");
  return t("suggest_repeat");

function formatSetCompact(set){
  if(!set) return t("no_sets_saved");

async function loadExercisePerformance(exerciseName, options = {}){
  const name = String(exerciseName || "").trim();
  if(!name) return;
  const excludeDate = String(options.excludeDate || "").trim();
  const cacheKey = excludeDate ? `${name}::${excludeDate}` : name;
  if(exercisePerformanceCache[cacheKey] && !exercisePerformanceCache[cacheKey].loading && !options.force){
    return;
  }
  exercisePerformanceCache[cacheKey] = { loading: true };
  if(performedEditor?.exercise_name === name){
    renderModal();
  }
  try {
    const query = excludeDate ? `?exclude_date=${encodeURIComponent(excludeDate)}` : "";
    const summary = await api(`/exercises/${encodeURIComponent(name)}/performance${query}`);
    exercisePerformanceCache[cacheKey] = summary;
  } catch (error) {
    exercisePerformanceCache[cacheKey] = { error: error.message };
  }
  if(performedEditor?.exercise_name === name){
    renderModal();
  }
}

function deleteDayActivityAtIndex(index){
  syncSessionGeneralDraft();
  commitSessionViewToActiveActivity();
  session.activities = Array.isArray(session.activities) ? session.activities : [];
  const currentDraftActivity = normalizeDayActivityClient({
    exercises: session.exercises,
    note: session.note,
    status: session.status,
    load: session.load,
    physio_time: session.physio_time,
    title: session.activity_title,
    activity_type: session.activity_type,
    activity_details: session.activity_details,
    image: session.image,
    climbing_routes: session.climbing_routes,
    performed_items: session.performed_items,
    used_equipment: session.used_equipment,
  });
  if(!session.activities.length){
    if(!activityHasContentClient(currentDraftActivity)){
      return;
    }
  }
  const confirmed = window.confirm(t("delete_activity_confirm"));
  if(!confirmed){
    return;
  }
  const safeIndex = Math.max(0, Math.min(Number(index) || 0, Math.max(0, session.activities.length - 1)));
  if(session.activities.length){
    session.activities.splice(safeIndex, 1);
  }
  if(!session.activities.length){
    session.exercises = [];
    session.note = "";
    session.status = "todo";
    session.load = 0;
    session.physio_time = "";
    session.activity_title = "";
    session.activity_type = "";
    session.activity_details = "";
    session.image = "";
    session.climbing_routes = [];
    session.performed_items = [];
    session.used_equipment = [];
    dayModalView = "overview";
  }
  const nextIndex = session.activities.length ? Math.max(0, Math.min(activeActivityIndex > safeIndex ? activeActivityIndex - 1 : activeActivityIndex, session.activities.length - 1)) : 0;
  loadActivityIntoSessionView(nextIndex);
  performedEditor = blankPerformedEditor();
  performedExerciseSearch = "";
  captureSessionDraft();
  renderModal();
}

function getPerformedEditorWeightUnit(){
  if(performedEditor?.weight_unit){
    return normalizeWeightUnit(performedEditor.weight_unit);
  }
  if(Array.isArray(performedEditor?.sets)){
    const lastSetWithUnit = [...performedEditor.sets].reverse().find((set) => set?.weight_unit);
    if(lastSetWithUnit?.weight_unit){
      return normalizeWeightUnit(lastSetWithUnit.weight_unit);
    }
  }
  return normalizeWeightUnit(getExerciseWeightUnit(performedEditor?.exercise_name));
}

function syncPerformedSetInputDraft(options = {}){
  if(!performedEditor) return;
  const sourceUnit = normalizeWeightUnit(options.sourceUnit || getPerformedEditorWeightUnit());
  const targetUnit = normalizeWeightUnit(options.targetUnit || sourceUnit);
  const repsInput = document.getElementById("setReps");
  const weightInput = document.getElementById("setWeight");
  const hoursInput = document.getElementById("setDurationHours");
  const minutesInput = document.getElementById("setDurationMinutes");
  const secondsInput = document.getElementById("setDurationSeconds");
  const wattsInput = document.getElementById("setWatts");
  performedEditor.draft_reps = repsInput ? String(repsInput.value || "") : String(performedEditor.draft_reps || "");
  if(weightInput){
    const convertedWeight = convertWeightUnit(weightInput.value, sourceUnit, targetUnit);
    performedEditor.draft_weight = convertedWeight === null ? String(weightInput.value || "") : String(convertedWeight);
  }
  performedEditor.draft_duration_hours = hoursInput ? String(hoursInput.value || "") : String(performedEditor.draft_duration_hours || "");
  performedEditor.draft_duration_minutes = minutesInput ? String(minutesInput.value || "") : String(performedEditor.draft_duration_minutes || "");
  performedEditor.draft_duration_seconds = secondsInput ? String(secondsInput.value || "") : String(performedEditor.draft_duration_seconds || "");

function slugifyExerciseName(label){
  return String(label || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "") || "nouvel_exercice";
}

async function createExerciseFromPerformedEditor(){
  syncPerformedEditorDraft();
  const sourceLabel = String(performedEditor.custom_name || "").trim() || String(document.getElementById("performedCustomName")?.value || "").trim();
  if(!sourceLabel){
    alert("Saisis d'abord un nom libre pour creer un nouvel exercice.");
    return;
  }

  const existing = exerciseList.find((exercise) => getExerciseDisplayName(exercise).toLowerCase() === sourceLabel.toLowerCase());
  if(existing){
    performedEditor.exercise_name = existing.name;
    performedEditor.custom_name = sourceLabel;
    renderModal();
    return;
  }

  const baseName = slugifyExerciseName(sourceLabel);
  let technicalName = baseName;
  let suffix = 2;
  while(exerciseList.some((exercise) => exercise.name === technicalName)){
    technicalName = `${baseName}_${suffix}`;
    suffix += 1;
  }

  await api("/exercises", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name: technicalName,
      display_name: sourceLabel,
      display_name_fr: getCurrentLanguage() === "fr" ? sourceLabel : "",
      display_name_en: getCurrentLanguage() === "en" ? sourceLabel : "",
      category: "",
      description: "",
      tracking_mode: normalizeTrackingMode(getExerciseTrackingMode(performedEditor.exercise_name)),
      weight_unit: normalizeWeightUnit(getExerciseWeightUnit(performedEditor.exercise_name)),
    })
  });
  await fetchExercises();
  performedEditor.exercise_name = technicalName;
  performedEditor.custom_name = sourceLabel;
  renderModal();
}

    "Convert this exercise description into valid JSON for my exercise library.",
    "",
    "Return raw JSON only.",
    "No markdown.",
    "No explanation.",
    "",
    "Expected shape:",
    "{",

    "- keep unknown fields empty rather than inventing details.",
    "",
    "Exercise description:",

      : { reps, weight, weight_unit: weightUnit }
  );
  if(!set){
    alert(trackingMode === "time_watts" ? "Ajoute au moins une durée (hh:mm:ss) ou des watts." : "Ajoute au moins des reps ou un poids.");
    return;
  }
  performedEditor.sets = performedEditor.sets || [];
  performedEditor.sets.push(set);
  performedEditor.weight_unit = weightUnit;
  clearPerformedSetInputDraft();
  const repsInput = document.getElementById("setReps");
  const weightInput = document.getElementById("setWeight");
  const hoursInput = document.getElementById("setDurationHours");
  const minutesInput = document.getElementById("setDurationMinutes");
  const secondsInput = document.getElementById("setDurationSeconds");
  const wattsInput = document.getElementById("setWatts");

  if(weightInput) weightInput.value = "";
  if(hoursInput) hoursInput.value = "";
  if(minutesInput) minutesInput.value = "";
  if(secondsInput) secondsInput.value = "";
  if(wattsInput) wattsInput.value = "";
  renderModal();
  requestAnimationFrame(resetPerformedSetInputsDom);
}

    return;
  }

  let payload;
  try {
    payload = JSON.parse(raw);
  } catch (error) {
    alert("JSON invalide.");
    return;
  }

  const performedItemsSource = Array.isArray(payload) ? payload : payload.performed_items;
  if(!Array.isArray(performedItemsSource)){
    alert("Le JSON doit contenir un tableau performed_items.");
    return;
  }

  const normalizedItems = performedItemsSource.map(normalizePerformedItemClient).filter(Boolean);
  session.performed_items = normalizedItems;
  if(typeof payload.note === "string") session.note = payload.note;
  if(typeof payload.physio_time === "string") session.physio_time = payload.physio_time;
  if(payload.load !== undefined && payload.load !== null && payload.load !== ""){
    session.load = Number(payload.load) || 0;
  }
  if(payload.replace_planned){
    clearPlannedSessionFields(false);
  }
  updateSessionExerciseNames();
  performedEditor = blankPerformedEditor();
  renderModal();
}

function detectImportFormat(text, fileName = ""){
  const trimmed = String(text || "").trim();
  const lowerFileName = String(fileName || "").toLowerCase();
  if(lowerFileName.endsWith(".json")) return "json";
  if(lowerFileName.endsWith(".csv")){
    if(trimmed.includes("exercise_name")) return "schedule_csv";
    return "exercises_csv";
  }
  if(trimmed.startsWith("{") || trimmed.startsWith("[")) return "json";
  if(trimmed.includes("exercise_name")) return "schedule_csv";
  return "exercises_csv";
}

      .replace("{sessions}", String(result.imported_sessions || 0))

    document: document.getElementById("exDocument").value.trim(),
  };
  if(!payload.name) return;

  let result;
  try {
    if(editingExerciseName){
      result = await api(`/exercises/${encodeURIComponent(editingExerciseName)}`, {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
    } else {
      result = await api("/exercises", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
    }
  } catch (error) {
    if(String(error?.message || "").includes("technical name")){
      alert(t("technical_name_conflict_alert"));
      return;
    }
    throw error;
  }

  const savedExercise = result?.exercise || payload;
  selectedExerciseName = savedExercise.name || payload.name;
  editingExerciseName = null;
  exerciseEditorDraft = null;
  exerciseEditorOpen = false;
  await loadExercises(true);
  viewExercise(toJs(savedExercise));
}

async function mergeExercise(sourceName, selectId){
  const safeSourceName = String(sourceName || "").trim();
  const targetName = document.getElementById(selectId)?.value?.trim() || "";
  if(!safeSourceName || !targetName || safeSourceName === targetName){
    return;
  }
  const sourceExercise = exerciseList.find((exercise) => exercise.name === safeSourceName);
  const targetExercise = exerciseList.find((exercise) => exercise.name === targetName);
  const sourceLabel = sourceExercise ? getExerciseDisplayName(sourceExercise) : safeSourceName;
  const targetLabel = targetExercise ? getExerciseDisplayName(targetExercise) : targetName;
  const confirmationMessage = t("merge_exercise_confirm")
    .replace("{source}", sourceLabel)
    .replace("{target}", targetLabel);
  if(!confirm(confirmationMessage)){
    return;
  }
  const result = await api(`/exercises/${encodeURIComponent(safeSourceName)}/merge-into`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ target_name: targetName })
  });
  selectedExerciseName = result?.exercise?.name || targetName;
  editingExerciseName = null;
  exerciseEditorOpen = false;
  exerciseEditorDraft = null;
  await loadExercises(true);
  viewExercise(toJs(result?.exercise || targetExercise || { name: targetName }));
}

async function delEx(name, displayName = ""){
  const safeName = String(name || "").trim();
  const safeDisplayName = String(displayName || safeName).trim();
  const confirmationWord = t("delete_confirm_word");
  const confirmation = window.prompt(
    t("delete_exercise_warning")
      .replace("{word}", confirmationWord)
      .replace("{name}", safeDisplayName)
  );
  if(confirmation !== confirmationWord){
    return;
  }
  await api(`/exercises/${encodeURIComponent(safeName)}`, { method:"DELETE" });
  if(selectedExerciseName === safeName){
    selectedExerciseName = null;
  }
  if(editingExerciseName === safeName){
    editingExerciseName = null;
  }
  loadExercises(true);
}

async function openDay(date, options = {}){
  if(document.getElementById("modal").style.display === "flex" && currentDate && currentDate !== date){
    persistSessionDraft();
  }
  currentDate = date;
  session = await api(`/session/${date}`);
  exerciseList = await api("/exercises");
  myEquipment = await api("/my-equipment");
  ensureSessionCollections();
  if(!session.activities.length && !session.performed_items.length && session.exercises.length){
    session.performed_items = session.exercises.map((exerciseName) => ({ exercise_name: exerciseName, sets: [] }));
  }
  ensureSessionActivities();
  if(session.activities.length){
    loadActivityIntoSessionView(activeActivityIndex);
  }
  updateSessionExerciseNames();
  performedEditor = blankPerformedEditor();
  plannedEditor = blankPlannedEditor();
  performedExerciseSearch = "";
  dayModalView = options?.preferNewActivity ? "detail" : "overview";
  dayModalDetailTarget = "activity";
  plannedSectionExpanded = Boolean(session.plan_title || session.plan_activity_type || session.plan_time || (session.planned_items || []).length);
  const restoredEmbeddedDraft = restoreEmbeddedSessionDraft();
  const restoredDraft = restoreSessionDraft(date) || restoredEmbeddedDraft;
  ensureSessionActivities();
  if(session.activities.length){
    loadActivityIntoSessionView(activeActivityIndex);
  }
  renderModal();
  document.getElementById("modal").style.display = "flex";
  setSessionAutosaveState("idle");
  if(options?.preferNewActivity){
    const alreadyHasActivity = Array.isArray(session.activities) && session.activities.some((activity) => activityHasContentClient(activity));
    if(alreadyHasActivity){
      addDayActivity();
    }
  }
  if(restoredDraft && (performedEditor?.exercise_name || performedEditor?.custom_name || (performedEditor?.sets || []).length)){
    requestAnimationFrame(() => scrollToPerformedEditor());
  }
}

function applySessionResponseData(nextSession, activityIndex = activeActivityIndex){
  if(!nextSession || typeof nextSession !== "object"){
    return;
  }
  session = nextSession;
  ensureSessionCollections();
  ensureSessionActivities();
  if(session.activities.length){
    activeActivityIndex = Math.max(0, Math.min(activityIndex, session.activities.length - 1));
    loadActivityIntoSessionView(activeActivityIndex);
  }
  updateSessionExerciseNames();
}

async function ensureActivityDraftPersisted(){
  if(!currentDate) return;
  if(sessionAutosaveTimer){
    clearTimeout(sessionAutosaveTimer);
    sessionAutosaveTimer = null;
  }
  sessionAutosaveQueued = false;
  await api(`/session/${currentDate}`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(buildSessionRequestPayload({ includeDraft: true }))
  });
}

async function uploadActivityImage(){
  const input = document.getElementById("activityImageUpload");
  const file = input?.files?.[0];
  if(!file){
    alert("Choisis d'abord une image.");
    return;
  }
  await ensureActivityDraftPersisted();
  const formData = new FormData();
  formData.append("image_file", file);
  const result = await api(`/session/${currentDate}/activities/${activeActivityIndex}/upload-image`, {
    method:"POST",
    body: formData
  });
  applySessionResponseData(result.session, activeActivityIndex);
  renderModal();
}

async function deleteActivityImage(){
  if(!session.image) return;
  if(!confirm("Supprimer la photo de cette activité ?")) return;
  await ensureActivityDraftPersisted();
  const result = await api(`/session/${currentDate}/activities/${activeActivityIndex}/delete-image`, {
    method:"POST"
  });
  applySessionResponseData(result.session, activeActivityIndex);
  renderModal();
}

async function save(){
  if(sessionAutosaveTimer){
    clearTimeout(sessionAutosaveTimer);
    sessionAutosaveTimer = null;
  }
  sessionAutosaveQueued = false;
  await api(`/session/${currentDate}`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(buildSessionRequestPayload({ includeDraft: false }))
  });

  exercisePerformanceCache = {};
  session.draft_performed_editor = {};
  session.draft_planned_editor = {};
  session.draft_selected_strength_category = "";
  session.draft_planned_section_expanded = false;
  session.draft_updated_at = "";
  clearSessionDraft(currentDate);
  closeModal(false);
  loadCalendar();
}

function escapeAttr(str){
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function escapeJs(str){
  return String(str || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatAuditDateTime(value){
  const raw = String(value || "").trim();
  if(!raw) return "-";
  const parsed = new Date(raw);
  if(Number.isNaN(parsed.getTime())) return raw;
  return parsed.toLocaleString(getCurrentLanguage() === "en" ? "en-GB" : "fr-CH", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function setAuthSession(payload){
  authToken = payload.token;
  authUser = payload.username;
  authState = {
    username: payload.username,
    is_admin: Boolean(payload.is_admin),
    must_change_password: Boolean(payload.must_change_password),
    language: payload.language === "en" ? "en" : "fr",
  };
  localStorage.setItem("rehabToken", authToken);
  localStorage.setItem("rehabUsername", authUser);
}

function clearAuthSession(){
  authToken = "";
  authUser = "";
  authState = null;
  localStorage.removeItem("rehabToken");
  localStorage.removeItem("rehabUsername");
  closeModal();
}

function renderAuthState(){

async function api(path, options = {}, config = {}){
  const headers = { ...(options.headers || {}) };
  if(authToken){
    headers.Authorization = `Bearer ${authToken}`;
  }

  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  const text = await res.text();
  let data = {};

  if(text){
    try {
      data = JSON.parse(text);
    } catch (error) {
      data = { detail: text };
    }
  }

  if(!res.ok){
    if(res.status === 401 && !config.allowUnauthorized){
      clearAuthSession();
      renderAuthPage("Votre session a expire. Merci de vous reconnecter.");
    }
    throw new Error(data.detail || `API ${res.status}`);
  }

  return data;
}

function show(page){
  if(!authToken || !authState){
    renderAuthPage("Connectez-vous pour acceder au suivi.");
    return;
  }
  if(page === "admin" && !authState.is_admin){
    show("account");
    return;
  }
  if(document.getElementById("modal").style.display === "flex"){
    closeModal(true);
  }

  document.getElementById("authPage").style.display = "none";
  document.getElementById("calendar").style.display = "none";
  document.getElementById("exercises").style.display = "none";
  document.getElementById("equipment").style.display = "none";
  document.getElementById("settings").style.display = "none";
  document.getElementById("account").style.display = "none";
  document.getElementById("admin").style.display = "none";
  document.getElementById("importPage").style.display = "none";
  document.getElementById(page).style.display = "block";
  document.getElementById("topbar").style.display = "flex";

  if(page === "calendar") loadCalendar();
  if(page === "exercises") loadExercises(true);
  if(page === "equipment") loadEquipmentPage();
  if(page === "settings") loadSettings();
  if(page === "account") loadAccount();
  if(page === "admin") loadAdmin();
  if(page === "importPage") loadImportPage();
}

async function login(){
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPassword").value;

  try {
    const payload = await api("/auth/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ username, password })
    }, { allowUnauthorized: true });

    setAuthSession(payload);
    show("calendar");
  } catch (error) {
    renderAuthPage("Connectez-vous pour acceder au suivi.", error.message, username);
  }
}

async function deleteUser(index){
