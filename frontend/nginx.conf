limit_req_zone $binary_remote_addr zone=rehab_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rehab_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~* (^|/)\.(?!well-known/) {
        return 404;
    }

    location ~* /(wp-admin|wp-login|xmlrpc\.php|phpinfo|phpmyadmin|adminer|boaform|cgi-bin|actuator|vendor)(/|$) {
        return 404;
    }

    location ~* \.(php|phar|phtml|env|ini|log|sql|bak|backup|swp|old|orig|save)(\.|$) {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=rehab_login burst=5 nodelay;
        proxy_pass http://backend:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location /api/ {
        limit_req zone=rehab_api burst=120 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /legacy {
        return 404;
    }

    location = /legacy.html {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
