name: Triage Telegram Issues

on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing GitHub issue number to backfill"
        required: true
        type: string

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Telegram issue payload
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === 'workflow_dispatch'
              ? Number(core.getInput('issue_number'))
              : context.payload.issue.number;
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const labels = (issue.data.labels || []).map((label) => typeof label === 'string' ? label : label.name);
            const fromTelegram = labels.includes('from-telegram') || (issue.data.body || '').includes('Imported from Telegram');
            if (!fromTelegram) {
              core.setFailed(`Issue #${issueNumber} is not marked from Telegram`);
              return;
            }
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('issue_title', issue.data.title);
            core.setOutput('issue_url', issue.data.html_url);
            core.setOutput('issue_body', issue.data.body || '');

      - name: Mark Telegram issues for Codex handoff
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.issue.outputs.issue_number }}');
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const labels = (issue.data.labels || []).map((label) => typeof label === 'string' ? label : label.name);
            const desiredLabels = ['codex-ready'];
            const missingLabels = desiredLabels.filter((label) => !labels.includes(label));
            if (missingLabels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: missingLabels,
              });
            }
            const removableLabels = ['auto-pr-draft'];
            for (const label of removableLabels) {
              if (!labels.includes(label)) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (error) {
                core.warning(`Could not remove label ${label}: ${error.message}`);
              }
            }

      - name: Comment with Codex handoff
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.issue.outputs.issue_number }}');
            const issueTitle = `${{ steps.issue.outputs.issue_title }}`;
            const issueUrl = `${{ steps.issue.outputs.issue_url }}`;
            const repoName = context.repo.owner + '/' + context.repo.repo;
            const handoff = [
              'Telegram request received and queued.',
              '',
              '- Source: Telegram',
              '- Status: ready for Codex/manual implementation',
              '- Reliability mode: issue backlog + Codex handoff',
              '',
              '### Codex handoff',
              '```text',
              `Open repo ${repoName} in Codex and implement GitHub issue #${issueNumber}: ${issueTitle}.`,
              `Issue: ${issueUrl}`,
              `After implementation, close issue #${issueNumber}.`,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: handoff,
            });
