services:
  backend:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      REHAB_DB_PATH: /app/data/dev.sqlite

  frontend:
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
