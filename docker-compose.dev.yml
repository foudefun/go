services:
  backend:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      REHAB_DB_PATH: /app/data/dev.sqlite
      REHAB_DEFAULT_PASSWORD: changeme123
      REHAB_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173,http://127.0.0.1:5173

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
