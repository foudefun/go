
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      REHAB_DB_PATH: /app/data/dev.sqlite
      REHAB_DEFAULT_PASSWORD: changeme123

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
